; Phase 4 runtime check (tools/runtime/hms/README.md). Configuration only: no HMS file is edited.
; Notices and warnings go to a log file, not into the HTML the browser receives.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/errors.log
error_reporting = E_ALL
; HMS connects with mysqli_connect("localhost", ...): "localhost" means the Unix socket, which the database
; container shares through the volume mounted at /run/mysqld.
mysqli.default_socket = /run/mysqld/mysqld.sock
date.timezone = UTC
