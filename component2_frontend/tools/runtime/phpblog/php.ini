; Phase 4e runtime check (tools/runtime/phpblog/README.md). Configuration only: no phpBlog file is edited.
; Notices and warnings go to a log file, not into the HTML the browser receives.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/errors.log
error_reporting = E_ALL
date.timezone = UTC
