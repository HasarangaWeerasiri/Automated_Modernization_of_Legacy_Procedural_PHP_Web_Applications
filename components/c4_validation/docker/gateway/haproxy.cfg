# The only way into the validation environment.
#
# Both systems and both databases sit on a private network with no route out
# (NFR6). This gateway is the one container that also has a host-facing network,
# and it forwards four TCP ports inwards. It runs no application code, and in TCP
# mode it never inspects or alters what passes through it.

global
    maxconn 256

resolvers docker
    # Docker's embedded DNS, so a recreated container is found at its new address.
    nameserver dns 127.0.0.11:53
    hold valid 2s

defaults
    mode tcp
    timeout connect 5s
    timeout client 10m
    timeout server 10m
    default-server resolvers docker init-addr libc,none

listen legacy-web
    bind :8080
    server target legacy-web:80

listen legacy-db
    bind :3307
    server target legacy-db:3306

listen migrated-api
    bind :8000
    server target migrated-api:8000

listen migrated-db
    bind :3308
    server target migrated-db:3306
