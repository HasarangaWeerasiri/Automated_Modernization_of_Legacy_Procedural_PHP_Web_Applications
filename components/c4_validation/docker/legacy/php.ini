; Notices and warnings go to the error log, never into the HTML body: text printed
; into the body would be picked up as data by Stage 2 value extraction.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Benchmarks commonly hardcode mysqli_connect("localhost", ...). With mysqli,
; "localhost" means the Unix socket, so the database container's socket is shared
; into this container. The application source stays byte-identical to upstream.
mysqli.default_socket = /var/run/mysqld/mysqld.sock
