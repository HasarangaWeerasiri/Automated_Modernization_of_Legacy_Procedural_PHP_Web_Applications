; Notices and warnings go to the error log, never into the HTML body: text printed
; into the body would be picked up as data by Stage 2 value extraction.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Benchmarks commonly hardcode a connection to "localhost". For PHP's MySQL
; extensions, "localhost" means the Unix socket, so the database container's socket
; is shared into this container, for whichever extension the application uses:
; mysqli, the old mysql_* functions of PHP 5, or PDO. The application source stays
; byte-identical to upstream.
mysqli.default_socket = /var/run/mysqld/mysqld.sock
mysql.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock

; One time zone for every run, so dates a page builds are the same in every capture.
; PHP 5 also warns when no zone is set.
date.timezone = UTC
