# C4 validation environment: the legacy system and the migrated system side by side.
#
# Normal use goes through the engine, which supplies every variable from config.py:
#
#   python -m c4.containers up
#
# To run Compose by hand, pass the same two files the engine reads:
#
#   docker compose --env-file .env --env-file benchmarks/<app>.env up -d --build
#
# .env                  machine-local settings
# benchmarks/<app>.env  which benchmark application to run
#
# The databases load a prepared, data-only copy of the benchmark's seed dump, which
# the engine writes before starting the containers (see containers.prepare_seed).
# Run the engine once before running Compose by hand.
#
# The defaults written here must match DEFAULTS in src/c4/config.py.
#
# Network isolation (NFR6): the two systems and their databases are attached only
# to `private`, which has no route out, so nothing they run can reach the internet
# or this machine's network. They publish no ports. The gateway is the single
# container on both networks, and the only one with host ports.

name: c4

# Every container says which benchmark it runs, so the engine can tell whether the
# running environment is the one it was asked for (python -m c4 run).
x-benchmark-label: &benchmark
  c4.benchmark: ${C4_BENCHMARK:-unknown}

services:
  legacy-db:
    image: mysql:5.7
    container_name: c4-legacy-db
    labels: *benchmark
    networks: [private]
    environment:
      # Benchmarks connect as root with an empty password. The database is
      # reachable only through the gateway, which binds to loopback.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${C4_LEGACY_DB_NAME:?set in benchmarks/<app>.env}
    volumes:
      # The dump's account statements run once, so the application can log in to
      # its database as written; every load and reset uses the data-only copy.
      - ${C4_LEGACY_ACCOUNTS:?run python -m c4.containers up}:/docker-entrypoint-initdb.d/00-accounts.sql:ro
      - ${C4_LEGACY_DATA:?run python -m c4.containers up}:/docker-entrypoint-initdb.d/seed.sql:ro
      - legacy-db-socket:/var/run/mysqld
    healthcheck:
      # TCP, not the socket: the image's temporary init server is socket-only, so
      # this passes only once the seed has loaded and the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  legacy-web:
    build:
      context: ./docker/legacy
      args:
        PHP_VERSION: ${C4_LEGACY_PHP:-7.4}
        PHP_EXTENSIONS: ${C4_LEGACY_PHP_EXTENSIONS:-mysqli}
    image: c4-legacy-web:php${C4_LEGACY_PHP:-7.4}
    container_name: c4-legacy-web
    labels: *benchmark
    networks: [private]
    volumes:
      # Read-only: a benchmark is never modified, not even by itself.
      - ${C4_LEGACY_DOCROOT:?set in benchmarks/<app>.env}:/var/www/html:ro
      - legacy-db-socket:/var/run/mysqld
    depends_on:
      legacy-db:
        condition: service_healthy

  migrated-db:
    image: mysql:8.0
    container_name: c4-migrated-db
    labels: *benchmark
    networks: [private]
    environment:
      MYSQL_ROOT_PASSWORD: ${C4_MIGRATED_DB_PASSWORD:-c4migrated}
      MYSQL_DATABASE: ${C4_MIGRATED_DB_NAME:-${C4_LEGACY_DB_NAME}}
    volumes:
      # The same dump as the legacy side unless a benchmark says otherwise (FR2).
      - ${C4_MIGRATED_DATA:?run python -m c4.containers up}:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  migrated-api:
    build: ./docker/migrated
    container_name: c4-migrated-api
    labels: *benchmark
    networks: [private]
    environment:
      DATABASE_URL: mysql+pymysql://root:${C4_MIGRATED_DB_PASSWORD:-c4migrated}@migrated-db:3306/${C4_MIGRATED_DB_NAME:-${C4_LEGACY_DB_NAME}}
    volumes:
      - ${C4_MIGRATED_APP:-./stub_api}:/app:ro
    depends_on:
      migrated-db:
        condition: service_healthy

  gateway:
    image: haproxy:3.0-alpine
    container_name: c4-gateway
    labels: *benchmark
    networks: [private, default]
    ports:
      - "127.0.0.1:${C4_LEGACY_WEB_PORT:-8080}:8080"
      - "127.0.0.1:${C4_LEGACY_DB_PORT:-3307}:3307"
      - "127.0.0.1:${C4_MIGRATED_API_PORT:-8000}:8000"
      - "127.0.0.1:${C4_MIGRATED_DB_PORT:-3308}:3308"
    volumes:
      - ./docker/gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - legacy-web
      - migrated-api

networks:
  private:
    internal: true

volumes:
  legacy-db-socket:
