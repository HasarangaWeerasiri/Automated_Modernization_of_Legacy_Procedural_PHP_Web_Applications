# Alembic configuration generated by Component 3 - Data Layer Migration.
#
# The database URL is NOT stored here. env.py reads it from the environment:
#   C3_ALEMBIC_URL   e.g. mysql+pymysql://c3_tester@127.0.0.1/c3_e3_myapp
#   C3_DB_PASSWORD   used when the URL has no password (session only)
#
# Usage:  alembic -c <output>/alembic/alembic.ini upgrade head

[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
